
services:
  db:
    image: postgres:17-alpine
    container_name: usage-metering-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: usage_metering
    ports:
      - "5433:5432"
    volumes:
      - usage_metering_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  usage_metering_data:
